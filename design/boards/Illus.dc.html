<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Mallikuvan merkintä</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}
</style>
</helmet>
<div style="width: 1280px; min-height: 1060px; box-sizing: border-box; padding: 48px; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; gap: 40px">

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <a href="#" class="card" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #18201B; background: #FFFFFF; border-radius: 18px; padding: 10px 10px 16px; border: 1px solid #E4E7DF">
        <div style="position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #E3E6DA">
          <img src="{{c.img}}" alt="" style="{{c.imgStyle}}">
          <sc-if value="{{c.duo}}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="position: absolute; inset: 0; background: #C4472B; mix-blend-mode: multiply; opacity: 0.35"></div>
            <span style="position: absolute; left: 10px; bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,.5)">Mallikuva</span>
          </sc-if>
          <sc-if value="{{c.badge}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 8px; border-radius: 999px; background: rgba(255,255,255,.92); color: #18201B; font-size: 12px; font-weight: 600; box-shadow: 0 1px 4px rgba(24,32,27,.18)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg>
              Mallikuva
            </span>
          </sc-if>
          <sc-if value="{{c.frame}}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="position: absolute; inset: 8px; border: 2px dashed rgba(255,255,255,.92); border-radius: 7px"></div>
            <span style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 2px 10px; border-radius: 999px; background: rgba(24,32,27,.62); color: #FFFFFF; font-size: 12px; font-weight: 600; white-space: nowrap">Suuntaa-antava kuva</span>
          </sc-if>
          <sc-if value="{{c.soft}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 5px 14px; border-radius: 999px; background: rgba(24,32,27,.55); color: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap">Mallikuva</span>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 6px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: -0.01em">{{c.title}}</h2>
          <span style="font-size: 14px; color: #5A635D">{{c.meta}}</span>
          <sc-if value="{{c.caption}}" hint-placeholder-val="{{ false }}">
            <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #5A635D">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg>
              Mallikuva
            </span>
          </sc-if>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 48px; align-items: start; padding-top: 32px; border-top: 1px solid #DDE0D8">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 60px; line-height: 1.02; letter-spacing: -0.035em">Kalakeitto</h1>
      <div style="display: flex; gap: 8px">
        <span style="padding: 4px 12px; border-radius: 999px; background: #E6E9E0; font-size: 14px; font-weight: 500">kala</span>
        <span style="padding: 4px 12px; border-radius: 999px; background: #E6E9E0; font-size: 14px; font-weight: 500">keitto</span>
      </div>
      <a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #18201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Kokkaa</a>
    </div>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="position: relative; aspect-ratio: 4 / 3; border-radius: 24px; overflow: hidden; background: #E3E6DA">
        <img src="/_blob/ce9c690cc5bb7c170623f08c721060fa" alt="Mallikuva: lohikeitto" style="{{hero.imgStyle}}">
        <sc-if value="{{hero.duo}}" hint-placeholder-val="{{ false }}">
          <div aria-hidden="true" style="position: absolute; inset: 0; background: #C4472B; mix-blend-mode: multiply; opacity: 0.35"></div>
          <span style="position: absolute; left: 18px; bottom: 14px; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0,0,0,.5)">Mallikuva</span>
        </sc-if>
        <sc-if value="{{hero.badge}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; left: 14px; top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: #18201B; font-size: 14px; font-weight: 600; box-shadow: 0 1px 4px rgba(24,32,27,.18)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg>
            Mallikuva – lopputulos voi näyttää erilaiselta
          </span>
        </sc-if>
        <sc-if value="{{hero.frame}}" hint-placeholder-val="{{ false }}">
          <div aria-hidden="true" style="position: absolute; inset: 14px; border: 2px dashed rgba(255,255,255,.92); border-radius: 14px"></div>
          <span style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 4px 14px; border-radius: 999px; background: rgba(24,32,27,.62); color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap">Suuntaa-antava kuva</span>
        </sc-if>
        <sc-if value="{{hero.soft}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 18px; border-radius: 999px; background: rgba(24,32,27,.55); color: #FFFFFF; font-size: 15px; font-weight: 600; white-space: nowrap">Mallikuva</span>
        </sc-if>
      </div>
      <sc-if value="{{hero.caption}}" hint-placeholder-val="{{ false }}">
        <figcaption style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #5A635D">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg>
          Mallikuva – lopputulos voi näyttää erilaiselta.
        </figcaption>
      </sc-if>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["badge","duo","frame","caption","soft"],"default":"badge"},"$preview":{"width":1280,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant || 'badge';
    var base = 'width: 100%; height: 100%; object-fit: cover; display: block; ';
    function look(illus) {
      var style = base;
      if (illus && v === 'duo') style += 'filter: grayscale(1) contrast(1.05);';
      if (illus && v === 'soft') style += 'filter: blur(2.5px) saturate(0.6); transform: scale(1.06);';
      return {
        imgStyle: style,
        badge: illus && v === 'badge', duo: illus && v === 'duo', frame: illus && v === 'frame',
        caption: illus && v === 'caption', soft: illus && v === 'soft'
      };
    }
    var cards = [
      { title: 'Hernekeitto', meta: '3 h · arki · keitto', img: '/_blob/7311c89d28281be7d030642d2c6d7534', illus: false },
      { title: 'Kalakeitto', meta: '40 min · kala · keitto', img: '/_blob/ce9c690cc5bb7c170623f08c721060fa', illus: true },
      { title: 'Makaronilaatikko', meta: '1 h · arki · vuoka', img: '/_blob/e045b7d78405effdab203b3ad622dbe4', illus: false },
      { title: 'Uunilohi ja juurekset', meta: '45 min · kala · ruoka', img: '/_blob/aa03fbc458bf742e196daf648fc67704', illus: true }
    ];
    return {
      cards: cards.map(function (c) { return Object.assign({ title: c.title, meta: c.meta, img: c.img }, look(c.illus)); }),
      hero: look(true)
    };
  }
}
</script>
</body>
</html>
