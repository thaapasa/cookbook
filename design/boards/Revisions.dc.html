<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Versiohistoria – Lohikeitto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}a:hover{color:#B23F25}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="border-bottom: 1px solid #DDE0D8">
    <div style="max-width: 1160px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18201B">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <button type="button" aria-label="Käyttäjä: Tuukka" style="margin-left: auto; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; font: 600 15px Figtree, sans-serif; color: #18201B">T</button>
    </div>
  </header>

  <main style="max-width: 1160px; margin: 0 auto; padding: 24px 24px 72px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Recipe.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; align-self: flex-start; text-decoration: none; font-weight: 600; font-size: 15px; color: #5A635D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
        Lohikeitto
      </a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: clamp(34px, 5vw, 48px); line-height: 1.05; letter-spacing: -0.03em">Versiohistoria</h1>
      <p style="margin: 0; color: #5A635D">Jokainen tallennus tekee uuden version. Voit palauttaa minkä tahansa aiemman version.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <ol aria-label="Versiot" style="flex: 1 1 340px; max-width: 420px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{revs}}" as="r" hint-placeholder-count="4">
          <li>
            <button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}">
              <span style="{{r.avatar}}">{{r.initial}}</span>
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline">
                  <strong style="font-weight: 600; font-size: 16px">{{r.author}}</strong>
                  <span style="font-size: 14px; color: #5A635D">{{r.when}}</span>
                  <sc-if value="{{r.current}}" hint-placeholder-val="{{ false }}">
                    <span style="padding: 1px 8px; border-radius: 999px; background: #18201B; color: #FFFFFF; font-size: 12px; font-weight: 600">Nykyinen</span>
                  </sc-if>
                </span>
                <span style="{{r.noteStyle}}">{{r.note}}</span>
              </span>
            </button>
          </li>
        </sc-for>
      </ol>

      <section aria-label="Valittu versio" style="flex: 999 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7DF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
          <div style="display: flex; flex-direction: column">
            <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">{{sel.title}}</h2>
            <span style="font-size: 14px; color: #5A635D">{{sel.author}} · {{sel.when}}</span>
          </div>
          <sc-if value="{{sel.canRestore}}" hint-placeholder-val="{{ true }}">
            <button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #C4472B; color: #FFFFFF; font: 600 15px Figtree, sans-serif; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
              Palauta tämä versio
            </button>
          </sc-if>
        </div>
        <h3 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A635D">{{sel.diffHead}}</h3>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{sel.diff}}" as="d" hint-placeholder-count="3">
            <li style="{{d.style}}">
              <span aria-hidden="true" style="font-weight: 700; width: 14px; flex: none">{{d.sign}}</span>
              <span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{d.sr}}</span>{{d.text}}</span>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1250}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    var self = this;
    var revs = [
      { author: 'Claude', when: '6.10.2026 klo 19.12', note: 'Kuohukerma vaihdettu kaurakermaan', diff: [
        ['-', 'Ainekset: 2 dl kuohukermaa'], ['+', 'Ainekset: 2 dl kaurakermaa'],
        ['-', 'Vaihe 6: Lisää kerma ja lohi.'], ['+', 'Vaihe 6: Lisää kaurakerma ja lohi.']
      ] },
      { author: 'Tuukka', when: '2.10.2026 klo 17.40', note: 'Keittoaika tarkennettu', diff: [
        ['-', 'Vaihe 4: Keitä noin 20 minuuttia.'], ['+', 'Vaihe 4: Keitä kannen alla noin 15 minuuttia, kunnes perunat ovat kypsiä.']
      ] },
      { author: 'Tuukka', when: '20.9.2026 klo 12.05', note: '', diff: [
        ['+', 'Tunniste: arki'], ['+', 'Kuva lisätty']
      ] },
      { author: 'Claude', when: '14.9.2026 klo 20.31', note: 'Tuotu reseptikortin kuvasta', diff: [] }
    ];
    var sel = this.state.sel;
    var base = 'width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; padding: 14px 16px; border-radius: 16px; cursor: pointer; font-family: Figtree, sans-serif; color: #18201B; ';
    var s = revs[sel];
    var diff = s.diff.map(function (d) {
      var add = d[0] === '+';
      return {
        sign: add ? '+' : '−', text: d[1], sr: add ? 'Lisätty: ' : 'Poistettu: ',
        style: 'display: flex; gap: 10px; padding: 10px 14px; border-radius: 10px; font-size: 16px; ' +
          (add ? 'background: #E3EEF8; color: #123A5C' : 'background: #FBE8DF; color: #7A2A14; text-decoration: line-through; text-decoration-thickness: 1px')
      };
    });
    return {
      revs: revs.map(function (r, i) {
        var on = i === sel;
        var claude = r.author === 'Claude';
        return {
          author: r.author, when: r.when, initial: r.author.charAt(0), current: i === 0,
          note: r.note || 'Ei kuvausta muutoksesta',
          noteStyle: r.note ? 'font-size: 15px; color: #3D4640' : 'font-size: 15px; color: #6B746E; font-style: italic',
          pressed: on ? 'true' : 'false',
          style: base + (on ? 'border: 2px solid #18201B; background: #FFFFFF' : 'border: 2px solid transparent; background: transparent'),
          avatar: 'width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-weight: 600; font-size: 15px; ' +
            (claude ? 'background: #C4472B; color: #FFFFFF' : 'background: #E6E9E0; color: #18201B'),
          pick: function () { self.setState({ sel: i }); }
        };
      }),
      sel: {
        title: sel === 0 ? 'Nykyinen versio' : 'Versio ' + (revs.length - sel),
        author: s.author, when: s.when,
        canRestore: sel !== 0,
        diffHead: s.diff.length ? 'Muutokset edelliseen versioon' : 'Ensimmäinen versio',
        diff: diff
      }
    };
  }
}
</script>
</body>
</html>
