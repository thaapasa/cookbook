<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Viikon ruoat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}a:hover{color:#B23F25}
.rl{text-decoration:none;color:#18201B}
.rl:hover .rt{color:#B23F25;text-decoration:underline;text-underline-offset:3px}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="border-bottom: 1px solid #DDE0D8; background: #F5F6F2">
    <div style="max-width: 1160px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18201B">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <nav aria-label="Osiot" style="display: flex; gap: 4px">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; color: #3D4640">Reseptit</a>
        <a href="WeekView.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #E6E9E0; text-decoration: none; font-weight: 600; font-size: 15px; color: #18201B">Viikko</a>
      </nav>
      <button type="button" aria-label="Käyttäjä: Tuukka" style="margin-left: auto; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; font: 600 15px Figtree, sans-serif; color: #18201B">T</button>
    </div>
  </header>

  <main style="max-width: 1160px; margin: 0 auto; padding: 36px 24px 72px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: clamp(34px, 5vw, 52px); line-height: 1.05; letter-spacing: -0.03em">Viikon ruoat</h1>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
          <button type="button" aria-label="Edellinen viikko" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #CDD2C8; background: #FFFFFF; color: #18201B; display: grid; place-items: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
          </button>
          <span style="min-width: 190px; text-align: center; font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums">{{range}}</span>
          <button type="button" aria-label="Seuraava viikko" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #CDD2C8; background: #FFFFFF; color: #18201B; display: grid; place-items: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </button>
          <sc-if value="{{notCurrent}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{toCurrent}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font: 600 15px Figtree, sans-serif; color: #B23F25; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Tämä viikko</button>
          </sc-if>
        </div>
      </div>
      <a href="WeekEdit.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #18201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path></svg>
        Muokkaa viikkoa
      </a>
    </div>

    <sc-if value="{{hasPlan}}" hint-placeholder-val="{{ true }}">
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <li style="{{d.rowStyle}}">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="{{d.nameStyle}}">{{d.name}}</span>
              <span style="font-size: 15px; color: #5A635D; font-variant-numeric: tabular-nums">{{d.date}}</span>
              <sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
                <span style="align-self: flex-start; margin-top: 2px; padding: 1px 9px; border-radius: 999px; background: #FBE8DF; color: #9E3820; font-size: 13px; font-weight: 600">Tänään</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
              <sc-for list="{{d.meals}}" as="m" hint-placeholder-count="1">
                <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center">
                  <sc-if value="{{m.isRecipe}}" hint-placeholder-val="{{ true }}">
                    <a href="Recipe.dc.html" tabindex="-1" aria-hidden="true" style="{{m.thumb}}">
                      <svg width="26" height="26" viewBox="0 0 48 48" fill="none" stroke="rgba(24,32,27,.35)" stroke-width="2.5" aria-hidden="true"><circle cx="24" cy="24" r="15"></circle><circle cx="24" cy="24" r="9"></circle></svg>
                    </a>
                    <div style="display: flex; flex-direction: column; min-width: 0">
                      <a href="Recipe.dc.html" class="rl" style="display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px">
                        <span class="rt" style="font-weight: 600; font-size: 18px">{{m.title}}</span>
                        <span style="font-size: 14px; color: #5A635D">{{m.time}}</span>
                      </a>
                      <sc-if value="{{m.note}}" hint-placeholder-val="{{ false }}">
                        <span style="font-size: 15px; line-height: 1.4; color: #5A635D">{{m.note}}</span>
                      </sc-if>
                    </div>
                    <sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
                      <a href="Cooking.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #CDD2C8; background: #FFFFFF; color: #18201B; text-decoration: none; font-weight: 600; font-size: 15px">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18v2a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7v-2Z"></path><path d="M9 7c0-1.5 1.5-1.5 1.5-3M14 7c0-1.5 1.5-1.5 1.5-3"></path></svg>
                        Kokkaa
                      </a>
                    </sc-if>
                  </sc-if>
                  <sc-if value="{{m.isText}}" hint-placeholder-val="{{ false }}">
                    <span aria-hidden="true" style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 12px; border: 1.5px dashed #B8BEB3; display: grid; place-items: center; color: #7E8781">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"></path></svg>
                    </span>
                    <span style="font-weight: 500; font-size: 18px">{{m.text}}</span>
                    <span></span>
                  </sc-if>
                </div>
              </sc-for>
              <sc-if value="{{d.empty}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 16px; color: #6B746E; font-style: italic; padding: 14px 0">Ei suunnitelmaa</span>
              </sc-if>
            </div>
          </li>
        </sc-for>
      </ol>
    </sc-if>
    <sc-if value="{{noPlan}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 72px 24px; text-align: center; border: 1px dashed #CDD2C8; border-radius: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center">
        <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">{{emptyText}}</p>
        <a href="WeekEdit.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #18201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Suunnittele viikko</a>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { offset: 0 };
  }
  renderVals() {
    var self = this;
    var off = this.state.offset;
    var names = ['Lauantai', 'Sunnuntai', 'Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai'];
    var todayIdx = 3;
    var plan = [
      [{ r: 'Uunilohi', time: '35 min', tone: '#DCE4D5', note: 'perunat uuniin samaan aikaan' }],
      [],
      [{ r: 'Makaronilaatikko', time: '1 h', tone: '#EFE2D6' }, { t: 'Kurkku-tomaattisalaatti' }],
      [{ r: 'Lohikeitto', time: '45 min', tone: '#E3E6DA', note: 'kaurakermalla, tuplasatsi – puolet huomiseksi' },
       { r: 'Mustikkapiirakka', time: '1 h', tone: '#DDE6E4', note: 'jälkiruoaksi, pakastemustikoista' }],
      [{ t: 'Lohikeiton tähteet' }],
      [{ r: 'Pinaattiohukaiset', time: '30 min', tone: '#ECE6D3', note: 'puolukkahillon kanssa' }],
      [{ t: 'Lihapullat ja perunamuusi' }]
    ];
    var start = new Date(2026, 9, 17 + off * 7);
    function fmt(d) { return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    var base = 'display: grid; grid-template-columns: minmax(130px, 200px) minmax(0, 1fr); gap: 12px 24px; align-items: start; padding: 18px 22px; border-radius: 20px; ';
    var days = names.map(function (n, i) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var isToday = off === 0 && i === todayIdx;
      var past = off < 0 || (off === 0 && i < todayIdx);
      var meals = off === 0 ? plan[i] : [];
      return {
        name: n, date: fmt(d), today: isToday, empty: meals.length === 0,
        rowStyle: base + 'background: #FFFFFF; border: 1px solid ' + (isToday ? '#E3A595' : '#E4E7DF'),
        nameStyle: 'font-family: \'Bricolage Grotesque\', sans-serif; font-weight: 700; letter-spacing: -0.01em; font-size: 20px',
        meals: meals.map(function (m) {
          return m.r
            ? { isRecipe: true, isText: false, title: m.r, time: m.time, note: m.note || '',
                thumb: 'width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; background: ' + m.tone }
            : { isRecipe: false, isText: true, text: m.t };
        })
      };
    });
    var hasPlan = off === 0;
    return {
      range: fmt(start) + ' – ' + fmt(end) + end.getFullYear(),
      prev: function () { self.setState({ offset: off - 1 }); },
      next: function () { self.setState({ offset: off + 1 }); },
      toCurrent: function () { self.setState({ offset: 0 }); },
      notCurrent: off !== 0,
      days: days,
      hasPlan: hasPlan,
      noPlan: !hasPlan,
      emptyText: off < 0 ? 'Tälle viikolle ei tehty suunnitelmaa' : 'Tälle viikolle ei ole vielä suunnitelmaa'
    };
  }
}
</script>
</body>
</html>
