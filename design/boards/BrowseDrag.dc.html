<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Reseptit ja vedettävä viikkopaneeli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}a:hover{color:#B23F25}
.dcard{cursor:grab;transition:transform .12s ease, box-shadow .12s ease}
.dcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(24,32,27,.12)}
.dcard:active{cursor:grabbing}
.chipm{cursor:grab}
.handle:focus-visible,.navb:focus-visible{outline:3px solid #C4472B;outline-offset:2px}
</style>
</helmet>
<div style="width: 1280px; min-height: 1300px; box-sizing: border-box; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="border-bottom: 1px solid #DDE0D8">
    <div style="padding: 16px 48px; display: flex; align-items: center; gap: 28px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18201B">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <nav aria-label="Osiot" style="display: flex; gap: 4px">
        <a href="Main.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #E6E9E0; text-decoration: none; font-weight: 600; font-size: 15px; color: #18201B">Reseptit</a>
        <a href="WeekView.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; color: #3D4640">Viikko</a>
      </nav>
      <div style="margin-left: auto; display: flex; gap: 12px; align-items: center">
        <a href="Editor.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #18201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">+ Uusi resepti</a>
        <a href="Profile.dc.html" aria-label="Profiili: Tuukka" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; display: grid; place-items: center; text-decoration: none; font-weight: 600; font-size: 15px; color: #18201B">T</a>
      </div>
    </div>
  </header>

  <div style="{{layoutStyle}}">
    <main style="padding: 32px 0 56px 48px; display: flex; flex-direction: column; gap: 22px; min-width: 0">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05; letter-spacing: -0.03em">Mitä tänään syötäisiin?</h1>
      <label style="position: relative; display: block">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hae reseptejä</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A635D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" placeholder="Hae nimellä tai raaka-aineella, esim. lohi" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 20px 0 52px; border-radius: 16px; border: 1px solid #CDD2C8; background: #FFFFFF; font: 400 17px Figtree, sans-serif; color: #18201B">
      </label>
      <div style="{{gridStyle}}">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
          <div class="dcard" draggable="true" onDragStart="{{c.dragStart}}" onDragEnd="{{dragEnd}}" style="display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E7DF">
            <a href="Recipe.dc.html" draggable="false" tabindex="-1" aria-hidden="true"><img src="{{c.img}}" alt="" draggable="false" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px"></a>
            <a href="Recipe.dc.html" draggable="false" style="display: block; padding: 0 6px; text-decoration: none; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2">{{c.name}}</a>
            <span style="padding: 0 6px; font-size: 14px; color: #5A635D">{{c.meta}}</span>
          </div>
        </sc-for>
      </div>
    </main>

    <div style="position: relative; display: flex; align-items: flex-start">
      <button type="button" class="handle" onClick="{{toggle}}" aria-expanded="{{expandedAttr}}" aria-controls="weekpanel" aria-label="{{handleLabel}}" style="{{handleStyle}}">
        <svg width="14" height="22" viewBox="0 0 14 22" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.8"></circle><circle cx="10" cy="4" r="1.8"></circle><circle cx="4" cy="11" r="1.8"></circle><circle cx="10" cy="11" r="1.8"></circle><circle cx="4" cy="18" r="1.8"></circle><circle cx="10" cy="18" r="1.8"></circle></svg>
        <sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
          <span style="writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600; font-size: 14px; letter-spacing: 0.04em">Viikko</span>
        </sc-if>
      </button>

      <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
        <aside id="weekpanel" aria-labelledby="wk-h" style="width: 380px; box-sizing: border-box; margin-top: 24px; margin-right: 24px; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E4E7DF; box-shadow: 0 12px 32px rgba(24,32,27,.08)">
          <div style="display: flex; align-items: center; gap: 6px">
            <button type="button" class="navb" onClick="{{prev}}" aria-label="Edellinen viikko" style="width: 40px; height: 40px; flex: none; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; display: grid; place-items: center; cursor: pointer; color: #18201B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
            </button>
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.2">
              <strong id="wk-h" style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px">{{weekTitle}}</strong>
              <span style="font-size: 13px; color: #5A635D; font-variant-numeric: tabular-nums">{{weekRange}}</span>
            </div>
            <button type="button" class="navb" onClick="{{next}}" aria-label="Seuraava viikko" style="width: 40px; height: 40px; flex: none; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; display: grid; place-items: center; cursor: pointer; color: #18201B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </div>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <li onDragOver="{{d.over}}" onDragLeave="{{d.leave}}" onDrop="{{d.drop}}" aria-label="{{d.aria}}" style="{{d.style}}">
                <span style="width: 36px; flex: none; display: flex; flex-direction: column; line-height: 1.15; padding-top: 6px">
                  <strong style="font-size: 15px">{{d.day}}</strong>
                  <span style="font-size: 11px; color: #5A635D">{{d.date}}</span>
                </span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                  <sc-for list="{{d.meals}}" as="m" hint-placeholder-count="1">
                    <span class="chipm" draggable="true" onDragStart="{{m.dragStart}}" onDragEnd="{{dragEnd}}" style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 4px; border-radius: 10px; background: #F5F6F2">
                      <img src="{{m.img}}" alt="" draggable="false" style="width: 34px; height: 34px; flex: none; border-radius: 8px; object-fit: cover">
                      <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.25">{{m.name}}</span>
                      <button type="button" onClick="{{m.remove}}" aria-label="{{m.removeLabel}}" style="width: 32px; height: 32px; flex: none; border: 0; border-radius: 999px; background: transparent; color: #5A635D; display: grid; place-items: center; cursor: pointer">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
                      </button>
                    </span>
                  </sc-for>
                  <sc-if value="{{d.showHint}}" hint-placeholder-val="{{ true }}">
                    <span style="{{d.hintStyle}}">{{d.hint}}</span>
                  </sc-if>
                </span>
              </li>
            </sc-for>
          </ol>
          <a href="WeekEdit.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; border: 1px solid #CDD2C8; text-decoration: none; font-weight: 600; font-size: 15px">Avaa viikon muokkaus</a>
          <p style="margin: 0; font-size: 13px; color: #5A635D">Vedä resepti päivän kohdalle. Päivälle mahtuu useampi ruoka, ja ruokia voi vetää päivästä toiseen.</p>
        </aside>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.drag = null;
    this.state = {
      open: props.open !== false,
      off: 0,
      over: -1,
      dragging: false,
      plans: {
        '-1': [['Aasialaiset tacot'], ['Broilerin fileet'], ['Lihapullat'], ['Kanakastike ja riisi'], ['Lohikeitto'], ['Gnocchipannu'], ['Halloumi-pinaattipasta']],
        '0': [[], ['Lasagne'], ['Broileripasta'], [], ['Lohikeitto'], [], ['Hampurilaiset', 'Kana-tofunuudeliwokki']]
      }
    };
  }
  renderVals() {
    var self = this, st = this.state, off = st.off;
    var R = [
      ['Hampurilaiset', 'la', 'd27b8d2c567195f5ea9f63cf74d06d07'], ['Aasialaiset tacot', 'la', '1dbc264081f01ff47eb58ef4d7e5259d'],
      ['Lasagne', 'su', 'a4f72fa58df319a0f90e0ab9a02ee1e7'], ['Broilerin fileet', 'su', '1e9f7e7374a84bc83b9da2e2c12c4406'],
      ['Lohikeitto', 'ar', 'c00344126316e06742af9f73a3781ac4'], ['Broileripasta', 'ar', '36f2339cb64149b33c121b4f89b0274d'],
      ['Kanakastike ja riisi', 'ar', 'cff2743a8d5c4b6fa6f0c70eae5b5f62'], ['Lihapullat', 'ar', 'beb5a18676f57ebaa849cf30e9fcd2c6'],
      ['Halloumi-pinaattipasta', 'ar', 'aa6ba162e85414157df691895649c606'], ['Kana-tofunuudeliwokki', 'ar', 'dd011c3d4c8fa50cac67126f549c1083'],
      ['Gnocchipannu', 'ar', '6000803b161e6a30c9a3615b6d95a943'], ['Lohikiusaus', 'ar', '69eac05d0709003ceaca909912d74e03']
    ];
    var tagName = { la: 'lauantai', su: 'sunnuntai', ar: 'arki' };
    var byName = {}; R.forEach(function (r) { byName[r[0]] = r; });
    var names = ['La', 'Su', 'Ma', 'Ti', 'Ke', 'To', 'Pe'];
    var start = new Date(2026, 10, 28 + off * 7), end = new Date(2026, 10, 34 + off * 7);
    function fmt(d) { return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }
    var plan = st.plans[off] || [[], [], [], [], [], [], []];
    function setPlan(p) { var all = Object.assign({}, self.state.plans); all[off] = p; self.setState({ plans: all, over: -1, dragging: false }); }
    function clone() { return plan.map(function (l) { return l.slice(); }); }
    function begin(payload) { return function (e) { self.drag = payload; try { e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', payload.name); } catch (x) {} self.setState({ dragging: true }); }; }
    var open = st.open, dragging = st.dragging;
    return {
      isOpen: open, closed: !open, expandedAttr: open ? 'true' : 'false',
      toggle: function () { self.setState({ open: !self.state.open }); },
      handleLabel: open ? 'Sulje viikkopaneeli' : 'Avaa viikkopaneeli',
      layoutStyle: 'display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: ' + (open ? '20px' : '12px') + '; align-items: start',
      gridStyle: 'display: grid; grid-template-columns: repeat(' + (open ? 3 : 4) + ', minmax(0, 1fr)); gap: 22px',
      handleStyle: open
        ? 'position: sticky; top: 140px; margin-top: 140px; width: 24px; height: 72px; border: 0; border-radius: 999px; background: #E6E9E0; color: #5A635D; display: grid; place-items: center; cursor: ew-resize; padding: 0'
        : 'position: sticky; top: 140px; margin-top: 120px; width: 44px; min-height: 150px; border: 1px solid #DDE0D8; border-right: 0; border-radius: 16px 0 0 16px; background: #FFFFFF; color: #18201B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: ew-resize; padding: 12px 0; box-shadow: -4px 0 16px rgba(24,32,27,.08)',
      dragEnd: function () { self.drag = null; self.setState({ dragging: false, over: -1 }); },
      cards: R.map(function (r) {
        return { name: r[0], img: '/_blob/' + r[2], meta: tagName[r[1]], dragStart: begin({ name: r[0], from: -1 }) };
      }),
      weekTitle: off === 0 ? 'Ensi viikko' : off === -1 ? 'Tämä viikko' : off < -1 ? (-off - 1) + ' vk sitten' : (off + 1) + ' vk päästä',
      weekRange: fmt(start) + ' – ' + fmt(end) + end.getFullYear(),
      prev: function () { self.setState({ off: off - 1 }); },
      next: function () { self.setState({ off: off + 1 }); },
      days: names.map(function (n, i) {
        var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        var isOver = st.over === i, meals = plan[i];
        return {
          day: n, date: fmt(d),
          aria: n + ' ' + fmt(d) + ': ' + (meals.length ? meals.join(', ') : 'tyhjä'),
          style: 'display: flex; gap: 10px; padding: 6px 6px 6px 10px; border-radius: 14px; min-height: 52px; box-sizing: border-box; transition: background .12s, box-shadow .12s; ' +
            (isOver ? 'background: #FBE8DF; box-shadow: inset 0 0 0 2px #C4472B' : dragging ? 'background: #FAFBF8; box-shadow: inset 0 0 0 1.5px #CDD2C8' : 'background: transparent; box-shadow: inset 0 0 0 1px #EEF0EA'),
          showHint: meals.length === 0 || isOver,
          hint: isOver ? 'Pudota tähän' : 'Tyhjä',
          hintStyle: 'display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; ' + (isOver ? 'color: #9E3820; font-weight: 600' : 'color: #8A938C; border: 1.5px dashed #DDE0D8'),
          over: function (e) { e.preventDefault(); if (self.state.over !== i) self.setState({ over: i }); },
          leave: function () { if (self.state.over === i) self.setState({ over: -1 }); },
          drop: function (e) {
            e.preventDefault();
            var p = self.drag; self.drag = null;
            if (!p) { self.setState({ over: -1, dragging: false }); return; }
            var np = clone();
            if (p.from >= 0) { var k = np[p.from].indexOf(p.name); if (k >= 0) np[p.from].splice(k, 1); }
            if (np[i].indexOf(p.name) < 0) np[i].push(p.name);
            setPlan(np);
          },
          meals: meals.map(function (name) {
            var r = byName[name];
            return {
              name: name, img: r ? '/_blob/' + r[2] : '',
              dragStart: begin({ name: name, from: i }),
              removeLabel: 'Poista ' + name + ' päivältä ' + n,
              remove: function () { var np = clone(); np[i] = np[i].filter(function (x) { return x !== name; }); setPlan(np); }
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
