<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Reseptit ja päivänvalitsin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}a:hover{color:#B23F25}
.addw{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font:600 14px Figtree,sans-serif;cursor:pointer}
.dayb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;min-height:56px}
.dayb:hover{background:#F0F2EC}
.dayb:focus-visible,.addw:focus-visible{outline:3px solid #C4472B;outline-offset:2px}
</style>
</helmet>
<div style="width: 1280px; min-height: 1360px; box-sizing: border-box; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="border-bottom: 1px solid #DDE0D8">
    <div style="padding: 16px 48px; display: flex; align-items: center; gap: 28px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18201B">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <nav aria-label="Osiot" style="display: flex; gap: 4px">
        <a href="Main.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #E6E9E0; text-decoration: none; font-weight: 600; font-size: 15px; color: #18201B">Reseptit</a>
        <a href="WeekView.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; color: #3D4640">Viikko</a>
      </nav>
      <div style="margin-left: auto; display: flex; gap: 12px; align-items: center">
        <a href="WeekEdit.dc.html" aria-label="{{weekAria}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CDD2C8; background: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">
          Ensi viikko
          <span aria-hidden="true" style="display: inline-flex; gap: 3px">
            <sc-for list="{{dots}}" as="d" hint-placeholder-count="7"><span style="{{d.style}}"></span></sc-for>
          </span>
          <span style="color: #5A635D; font-variant-numeric: tabular-nums">{{filledLabel}}</span>
        </a>
        <a href="Profile.dc.html" aria-label="Profiili: Tuukka" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; display: grid; place-items: center; text-decoration: none; font-weight: 600; font-size: 15px; color: #18201B">T</a>
      </div>
    </div>
  </header>

  <main style="padding: 32px 48px 56px; display: flex; flex-direction: column; gap: 22px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 48px; line-height: 1.05; letter-spacing: -0.03em">Mitä tänään syötäisiin?</h1>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
        <div style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E7DF">
          <a href="Recipe.dc.html" tabindex="-1" aria-hidden="true"><img src="{{c.img}}" alt="" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px"></a>
          <a href="Recipe.dc.html" style="display: block; padding: 0 6px; text-decoration: none; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2">{{c.name}}</a>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px">
            <span style="font-size: 14px; color: #5A635D">{{c.meta}}</span>
            <button type="button" class="addw" onClick="{{c.open}}" aria-expanded="{{c.expanded}}" aria-label="{{c.btnAria}}" style="{{c.btnStyle}}">{{c.btnText}}</button>
          </div>
          <sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ false }}">
            <div role="dialog" aria-label="{{c.popAria}}" style="position: absolute; left: 6px; right: 6px; top: calc(100% - 8px); z-index: 5; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDE0D8; box-shadow: 0 16px 40px rgba(24,32,27,.20)">
              <strong style="font-size: 14px; padding: 0 4px">Ensi viikolle – mille päivälle?</strong>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
                <sc-for list="{{c.days}}" as="d" hint-placeholder-count="7">
                  <button type="button" class="dayb" onClick="{{d.pick}}" aria-label="{{d.aria}}" style="{{d.style}}">
                    <span style="display: flex; align-items: baseline; gap: 6px"><strong style="font-size: 15px">{{d.day}}</strong><span style="font-size: 12px; opacity: 0.75">{{d.date}}</span>
                      <sc-if value="{{d.suggest}}" hint-placeholder-val="{{ false }}"><span style="margin-left: auto; font-size: 11px; font-weight: 600; color: #9E3820">ehdotus</span></sc-if>
                    </span>
                    <span style="{{d.subStyle}}">{{d.sub}}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1360}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: ['', 'Lasagne', 'Broileripasta', '', 'Lohikeitto', '', ''], open: 'Kanakastike ja riisi' };
  }
  renderVals() {
    var self = this, plan = this.state.plan, open = this.state.open;
    var R = [
      ['Hampurilaiset', 'la', 'd27b8d2c567195f5ea9f63cf74d06d07'], ['Aasialaiset tacot', 'la', '1dbc264081f01ff47eb58ef4d7e5259d'],
      ['Lasagne', 'su', 'a4f72fa58df319a0f90e0ab9a02ee1e7'], ['Broilerin fileet', 'su', '1e9f7e7374a84bc83b9da2e2c12c4406'],
      ['Lohikeitto', 'ar', 'c00344126316e06742af9f73a3781ac4'], ['Broileripasta', 'ar', '36f2339cb64149b33c121b4f89b0274d'],
      ['Kanakastike ja riisi', 'ar', 'cff2743a8d5c4b6fa6f0c70eae5b5f62'], ['Lihapullat', 'ar', 'beb5a18676f57ebaa849cf30e9fcd2c6'],
      ['Halloumi-pinaattipasta', 'ar', 'aa6ba162e85414157df691895649c606'], ['Kana-tofunuudeliwokki', 'ar', 'dd011c3d4c8fa50cac67126f549c1083'],
      ['Gnocchipannu', 'ar', '6000803b161e6a30c9a3615b6d95a943'], ['Lohikiusaus', 'ar', '69eac05d0709003ceaca909912d74e03']
    ];
    var tagName = { la: 'lauantai', su: 'sunnuntai', ar: 'arki' };
    var days = [['La', '28.11.'], ['Su', '29.11.'], ['Ma', '30.11.'], ['Ti', '1.12.'], ['Ke', '2.12.'], ['To', '3.12.'], ['Pe', '4.12.']];
    function suggestFor(slot) {
      if (slot === 'la') return 0; if (slot === 'su') return 1;
      for (var k = 2; k < 7; k++) if (!plan[k]) return k; return -1;
    }
    var filled = plan.filter(function (x) { return x; }).length;
    return {
      filledLabel: filled + '/7',
      weekAria: 'Ensi viikko: ' + filled + ' päivää 7:stä suunniteltu. Avaa viikon muokkaus.',
      dots: plan.map(function (x) { return { style: 'width: 8px; height: 8px; border-radius: 999px; background: ' + (x ? '#18201B' : '#D5D9CF') }; }),
      cards: R.map(function (r) {
        var at = plan.indexOf(r[0]), inPlan = at >= 0, isOpen = open === r[0], sug = suggestFor(r[1]);
        return {
          name: r[0], img: '/_blob/' + r[2], meta: tagName[r[1]],
          isOpen: isOpen, expanded: isOpen ? 'true' : 'false',
          btnText: inPlan ? '✓ ' + days[at][0] + ' ' + days[at][1] : '+ Viikolle',
          btnAria: inPlan ? r[0] + ' on ensi viikolla päivänä ' + days[at][0] + '. Vaihda päivää.' : 'Lisää ensi viikolle: ' + r[0],
          btnStyle: inPlan ? 'border: 0; background: #18201B; color: #FFFFFF' : 'border: 1px solid #CDD2C8; background: #FFFFFF; color: #18201B',
          popAria: 'Valitse päivä: ' + r[0],
          open: function () { self.setState({ open: isOpen ? '' : r[0] }); },
          days: days.map(function (d, i) {
            var cur = plan[i], mine = cur === r[0];
            return {
              day: d[0], date: d[1], suggest: i === sug && !mine,
              sub: mine ? 'Tämä resepti' : cur ? 'Korvaa: ' + cur : 'Vapaa',
              subStyle: 'font-size: 13px; line-height: 1.25; ' + (mine ? 'color: #FFFFFF; font-weight: 600' : cur ? 'color: #5A635D' : 'color: #3F7A3A; font-weight: 600'),
              aria: d[0] + ' ' + d[1] + ': ' + (mine ? 'tämä resepti, poista' : cur ? 'korvaa ' + cur : 'vapaa'),
              style: mine ? 'background: #18201B; color: #FFFFFF' : i === sug ? 'box-shadow: inset 0 0 0 2px #C4472B' : 'box-shadow: inset 0 0 0 1px #E4E7DF',
              pick: function () {
                var p = plan.slice(), was = p.indexOf(r[0]);
                if (was >= 0) p[was] = '';
                if (!mine) p[i] = r[0];
                self.setState({ plan: p, open: '' });
              }
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
