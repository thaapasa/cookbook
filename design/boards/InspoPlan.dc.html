<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Suunnittele ehdotuksista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}a:hover{color:#B23F25}
.add{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font:600 14px Figtree,sans-serif;cursor:pointer;flex:none}
.sec{margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#3D4640}
</style>
</helmet>
<div style="width: 1280px; min-height: 1080px; box-sizing: border-box; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.45">

  <header style="border-bottom: 1px solid #DDE0D8">
    <div style="padding: 16px 48px; display: flex; align-items: center; gap: 28px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18201B">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <nav aria-label="Osiot" style="display: flex; gap: 4px">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; color: #3D4640">Reseptit</a>
        <a href="WeekView.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #E6E9E0; text-decoration: none; font-weight: 600; font-size: 15px; color: #18201B">Viikko</a>
      </nav>
    </div>
  </header>

  <main style="padding: 32px 48px 56px; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 32px; align-items: start">
    <section aria-labelledby="plan-h" style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 id="plan-h" style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em">Ensi viikko</h1>
        <span style="color: #5A635D; font-variant-numeric: tabular-nums">28.11. – 4.12.2026</span>
      </div>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{plan}}" as="p" hint-placeholder-count="7">
          <li style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E7DF">
            <span style="display: flex; flex-direction: column; line-height: 1.2">
              <strong style="{{p.dayStyle}}">{{p.day}}</strong>
              <span style="font-size: 13px; color: #5A635D">{{p.date}}</span>
            </span>
            <sc-if value="{{p.filled}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
                <img src="{{p.img}}" alt="" style="width: 44px; height: 44px; flex: none; border-radius: 10px; object-fit: cover">
                <span style="font-weight: 600; flex: 1; min-width: 0">{{p.name}}</span>
                <button type="button" onClick="{{p.clear}}" aria-label="{{p.clearLabel}}" style="width: 40px; height: 40px; flex: none; border-radius: 999px; border: 0; background: transparent; color: #5A635D; display: grid; place-items: center; cursor: pointer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
                </button>
              </span>
            </sc-if>
            <sc-if value="{{p.empty}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{p.focus}}" style="{{p.emptyStyle}}">{{p.emptyText}}</button>
            </sc-if>
          </li>
        </sc-for>
      </ol>
    </section>

    <section aria-labelledby="sugg-h" style="display: flex; flex-direction: column; gap: 20px; padding: 22px 24px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E4E7DF">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <h2 id="sugg-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px">Ehdotukset</h2>
        <div role="tablist" aria-label="Aterian tyyppi" style="display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: #EEF0EA">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}"><span aria-hidden="true" style="{{t.dot}}"></span>{{t.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h3 class="sec">Pitkästä aikaa</h3>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{forgot}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: #FBF3EE; border: 1px solid #F3DDD2">
              <img src="{{s.img}}" alt="" style="width: 72px; height: 72px; flex: none; border-radius: 12px; object-fit: cover">
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                <strong style="font-size: 16px; line-height: 1.25">{{s.name}}</strong>
                <span style="font-size: 13px; color: #5A635D">{{s.stats}}</span>
              </span>
              <button type="button" class="add" onClick="{{s.add}}" aria-label="{{s.addLabel}}" style="{{s.btnStyle}}">{{s.btnText}}</button>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{noForgot}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; color: #5A635D; font-size: 15px">Kaikkia tämän tyypin suosikkeja on syöty viime aikoina.</p>
        </sc-if>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h3 class="sec">Kuuden viikon takaa · {{sixLabel}}</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{six}}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{s.add}}" aria-label="{{s.addLabel}}" style="{{s.chipStyle}}">
              <img src="{{s.img}}" alt="" style="width: 32px; height: 32px; border-radius: 999px; object-fit: cover">
              {{s.name}}
              <span aria-hidden="true" style="font-weight: 700">{{s.chipMark}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h3 class="sec">Suosikit</h3>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{favs}}" as="s" hint-placeholder-count="4">
            <div style="{{s.favStyle}}">
              <img src="{{s.img}}" alt="" style="width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; object-fit: cover; display: block">
              <strong style="font-size: 15px; line-height: 1.25">{{s.name}}</strong>
              <span style="font-size: 13px; color: #5A635D">{{s.stats}}</span>
              <button type="button" class="add" onClick="{{s.add}}" aria-label="{{s.addLabel}}" style="{{s.btnStyle}}">{{s.btnText}}</button>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.data = this.buildData();
    this.state = { tab: 'la', plan: ['', '', 'Broileripasta', '', 'Lohikeitto', '', ''] };
  }
  buildData() {
    var R = [
      ['Hampurilaiset', 'la', 'd27b8d2c567195f5ea9f63cf74d06d07'], ['Aasialaiset tacot', 'la', '1dbc264081f01ff47eb58ef4d7e5259d'],
      ['Hodarit', 'la', '8bb209344eef6c2c5f8ce191ba9ca929'], ['Blinit', 'la', '4f021ec311bb371862b2ee8203acf85c'],
      ['Lämpimät voileivät', 'la', '74f15b1e07d99711d511bff72619ef27'], ['Lasagne', 'su', 'a4f72fa58df319a0f90e0ab9a02ee1e7'],
      ['Broilerin fileet', 'su', '1e9f7e7374a84bc83b9da2e2c12c4406'], ['Hunajatofukana', 'su', 'c05cf42094405c3031931e71d984e024'],
      ['Makkarapelti', 'su', '9465ff29ba5658e290905ab1b7d8d00d'], ['Maalaissalaatti', 'su', 'bdb896833dc008a616e7e239ac34388d'],
      ['Lohi kasvispedillä', 'su', '0ab002d7ab1ae94f2b784558ffd869da'], ['Lohikeitto', 'ar', 'c00344126316e06742af9f73a3781ac4'],
      ['Broileripasta', 'ar', '36f2339cb64149b33c121b4f89b0274d'], ['Kanakastike ja riisi', 'ar', 'cff2743a8d5c4b6fa6f0c70eae5b5f62'],
      ['Lihapullat', 'ar', 'beb5a18676f57ebaa849cf30e9fcd2c6'], ['Makaronilaatikko', 'ar', '3cc23f4948238d8ae584fb0b78835e2b'],
      ['Halloumi-pinaattipasta', 'ar', 'aa6ba162e85414157df691895649c606'], ['Kana-tofunuudeliwokki', 'ar', 'dd011c3d4c8fa50cac67126f549c1083'],
      ['Hernekeitto', 'ar', 'e8c4e7c08d6d04430dd3c5e501c32b12'], ['Kasvissosekeitto', 'ar', 'a08333522f84b412489312b4b8e18899'],
      ['Kalapuikot ja muusi', 'ar', 'eab77a12bb2a9d7d219919797efeb545'], ['Lohikiusaus', 'ar', '69eac05d0709003ceaca909912d74e03'],
      ['Kermainen sienirisotto', 'ar', 'b905e01ab073ee4085de31db28871611'], ['Gnocchipannu', 'ar', '6000803b161e6a30c9a3615b6d95a943'],
      ['Broilerikiusaus', 'ar', 'db66ae33f1983e539514e7acb84abcbf'], ['Lohipasta', 'ar', '9eceaea2a2fb5f11bf0dfc4b7582df88']
    ];
    var SAT = [0, 1, 2, 0, 4, 1, 0, 2, 1, 3, 0, 3, 1, 2, 3, 0, 4, 1, 3, 0];
    var SUN = [6, 5, 8, 6, 10, 5, 6, 8, 5, 9, 7, 9, 6, 7, 5, 9, 7, 6, 9, 5];
    var WK = [[11, 12, 13, 14, 20], [16, 15, 12, 23, 14], [13, 25, 17, 12, 20], [11, 14, 16, 15, 12], [13, 18, 23, 20, 12],
      [11, 17, 14, 16, 19], [12, 15, 13, 25, 20], [14, 18, 12, 23, 11], [13, 16, 19, 20, 15], [21, 12, 22, 14, 13],
      [24, 11, 17, 20, 25], [22, 12, 21, 13, 18], [14, 24, 15, 16, 20], [21, 22, 12, 19, 13], [24, 14, 11, 23, 17],
      [22, 12, 21, 13, 15], [14, 24, 20, 16, 25], [21, 12, 22, 18, 13], [24, 14, 11, 15, 20], [22, 12, 21, 13, 23]];
    var recipes = R.map(function (r) { return { name: r[0], slot: r[1], img: '/_blob/' + r[2], count: 0, last: 99 }; });
    var byName = {}; recipes.forEach(function (r) { byName[r.name] = r; });
    for (var i = 0; i < 20; i++) {
      [SAT[i], SUN[i]].concat(WK[i]).forEach(function (k) { var r = recipes[k]; r.count++; if (i + 1 < r.last) r.last = i + 1; });
    }
    var six = { la: [recipes[SAT[5]]], su: [recipes[SUN[5]]], ar: WK[5].map(function (k) { return recipes[k]; }) };
    return { recipes: recipes, byName: byName, six: six,
      slots: { la: { label: 'Lauantai', color: '#C4472B' }, su: { label: 'Sunnuntai', color: '#2F5E8C' }, ar: { label: 'Arki', color: '#5F7F4F' } } };
  }
  renderVals() {
    var self = this, D = this.data, tab = this.state.tab, plan = this.state.plan;
    var days = [['La', '28.11.', 'la'], ['Su', '29.11.', 'su'], ['Ma', '30.11.', 'ar'], ['Ti', '1.12.', 'ar'], ['Ke', '2.12.', 'ar'], ['To', '3.12.', 'ar'], ['Pe', '4.12.', 'ar']];
    function inPlan(name) { return plan.indexOf(name) >= 0; }
    function addTo(r) {
      var p = plan.slice();
      if (inPlan(r.name)) { p[p.indexOf(r.name)] = ''; self.setState({ plan: p }); return; }
      var idx = r.slot === 'la' ? 0 : r.slot === 'su' ? 1 : -1;
      if (idx < 0) { for (var k = 2; k < 7; k++) if (!p[k]) { idx = k; break; } }
      if (idx < 0) return;
      p[idx] = r.name; self.setState({ plan: p });
    }
    function ago(r) { return r.last === 1 ? 'viime viikolla' : r.last + ' vk sitten'; }
    function sugg(r) {
      var on = inPlan(r.name);
      return {
        name: r.name, img: r.img, stats: r.count + '× · viimeksi ' + ago(r),
        add: function () { addTo(r); },
        addLabel: (on ? 'Poista suunnitelmasta: ' : 'Lisää ensi viikolle: ') + r.name,
        btnText: on ? '✓ Lisätty' : '+ Lisää',
        btnStyle: on ? 'border: 0; background: #18201B; color: #FFFFFF' : 'border: 1px solid #CDD2C8; background: #FFFFFF; color: #18201B',
        chipMark: on ? '✓' : '+',
        chipStyle: 'display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; font: 600 15px Figtree, sans-serif; cursor: pointer; ' + (on ? 'border: 1px solid #18201B; background: #18201B; color: #FFFFFF' : 'border: 1px solid #CDD2C8; background: #FFFFFF; color: #18201B'),
        favStyle: 'display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 10px; border-radius: 14px; border: 1px solid #E4E7DF;' + (r.last <= 2 ? ' opacity: 0.6;' : '')
      };
    }
    var pool = D.recipes.filter(function (r) { return r.slot === tab; });
    var forgot = pool.filter(function (r) { return r.last >= 5; }).sort(function (a, b) { return b.count - a.count; }).slice(0, 4).map(sugg);
    var favs = pool.slice().sort(function (a, b) { return b.count - a.count; }).slice(0, 4).map(function (r) {
      var s = sugg(r); if (r.last <= 2) s.stats = r.count + '× · syöty juuri'; return s;
    });
    return {
      plan: days.map(function (d, i) {
        var r = plan[i] ? D.byName[plan[i]] : null;
        return {
          day: d[0], date: d[1], filled: !!r, empty: !r,
          dayStyle: 'font-size: 17px; color: ' + D.slots[d[2]].color,
          name: r ? r.name : '', img: r ? r.img : '',
          clear: function () { var p = plan.slice(); p[i] = ''; self.setState({ plan: p }); },
          clearLabel: 'Poista: ' + (r ? r.name : ''),
          emptyText: tab === d[2] ? 'Valitse ehdotuksista →' : 'Tyhjä – näytä ehdotukset',
          emptyStyle: 'all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; font-size: 15px; ' + (tab === d[2] ? 'border: 1.5px dashed ' + D.slots[d[2]].color + '; color: #18201B; font-weight: 600' : 'border: 1.5px dashed #CDD2C8; color: #5A635D'),
          focus: function () { self.setState({ tab: d[2] }); }
        };
      }),
      tabs: ['la', 'su', 'ar'].map(function (s) {
        var on = tab === s;
        return { label: D.slots[s].label, selected: on ? 'true' : 'false',
          dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + D.slots[s].color,
          style: 'display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; font: 600 15px Figtree, sans-serif; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #18201B; box-shadow: 0 1px 2px rgba(24,32,27,.12)' : 'background: transparent; color: #3D4640'),
          pick: function () { self.setState({ tab: s }); } };
      }),
      forgot: forgot, noForgot: forgot.length === 0,
      six: D.six[tab].map(sugg), sixLabel: '10.–16.10.',
      favs: favs
    };
  }
}
</script>
</body>
</html>
