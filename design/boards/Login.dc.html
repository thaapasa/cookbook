<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Kirjaudu sisään</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F2}
a{color:#18201B}a:hover{color:#B23F25}
.f{box-sizing:border-box;width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid #CDD2C8;background:#FFFFFF;font:400 17px Figtree,sans-serif;color:#18201B}
.f:focus{outline:2px solid #C4472B;outline-offset:1px;border-color:#C4472B}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5F6F2; color: #18201B; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="border-bottom: 1px solid #DDE0D8; background: #F5F6F2">
    <div style="max-width: 1160px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 16px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #18201B">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <button type="button" onClick="{{cycleTheme}}" aria-label="{{themeLabel}}" title="{{themeTitle}}" style="margin-left: auto; width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #DDE0D8; background: #FFFFFF; display: grid; place-items: center; color: #18201B; cursor: pointer">
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>
        </sc-if>
        <sc-if value="{{isSystem}}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor"></path></svg>
        </sc-if>
      </button>
    </div>
  </header>

  <main style="max-width: 420px; margin: 0 auto; padding: 72px 24px 80px; display: flex; flex-direction: column; gap: 28px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 40px); line-height: 1.05; letter-spacing: -0.03em">Kirjaudu sisään</h1>
    <form style="display: flex; flex-direction: column; gap: 20px; padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E7DF">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 500; color: #3D4640">Käyttäjätunnus</span>
        <input class="f" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 500; color: #3D4640">Salasana</span>
        <input class="f" type="password" name="password" autocomplete="current-password" required>
      </label>
      <a href="Main.dc.html" style="display: grid; place-items: center; height: 52px; margin-top: 4px; border-radius: 999px; background: #18201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px">Kirjaudu</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'light' };
  }
  renderVals() {
    var self = this;
    var th = this.state.theme;
    return {
      isLight: th === 'light', isDark: th === 'dark', isSystem: th === 'system',
      themeTitle: { light: 'Vaalea tila', dark: 'Tumma tila', system: 'Järjestelmän mukaan' }[th],
      themeLabel: 'Teema: ' + { light: 'vaalea', dark: 'tumma', system: 'järjestelmän mukaan' }[th] + '. Vaihda teemaa.',
      cycleTheme: function () { self.setState({ theme: { light: 'dark', dark: 'system', system: 'light' }[self.state.theme] }); }
    };
  }
}
</script>
</body>
</html>
