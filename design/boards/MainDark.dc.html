<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Reseptit – tumma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121614}
a{color:#ECEEE8}a:hover{color:#F08A70}
input::placeholder{color:#7F8982}
.card{transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.45)}
</style>
</helmet>
<div style="min-height: 100vh; background: #121614; color: #ECEEE8; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="border-bottom: 1px solid #2A322D; background: #121614">
    <div style="max-width: 1160px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px">
      <a href="MainDark.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #ECEEE8">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C4472B"></circle><path d="M9 17h14a7 7 0 0 1-14 0Z" fill="#F5F6F2"></path><path d="M13 13c0-2 2-2 2-4M17 13c0-2 2-2 2-4" stroke="#F5F6F2" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Keittokirja</span>
      </a>
      <nav aria-label="Osiot" style="display: flex; gap: 4px">
        <a href="MainDark.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #262D28; text-decoration: none; font-weight: 600; font-size: 15px; color: #ECEEE8">Reseptit</a>
        <a href="WeekView.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; color: #C9D0CA">Viikko</a>
      </nav>
      <nav aria-label="Päävalikko" style="display: flex; gap: 12px; margin-left: auto; align-items: center; flex-wrap: wrap">
        <a href="Editor.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #ECEEE8; color: #121614; text-decoration: none; font-weight: 600; font-size: 15px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Uusi resepti
        </a>
        <button type="button" onClick="{{cycleTheme}}" aria-label="{{themeLabel}}" title="{{themeTitle}}" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #3A433D; background: #1B211D; display: grid; place-items: center; color: #ECEEE8; cursor: pointer">
          <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          </sc-if>
          <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>
          </sc-if>
          <sc-if value="{{isSystem}}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor"></path></svg>
          </sc-if>
        </button>
        <button type="button" aria-label="Käyttäjä: Tuukka" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A433D; background: #1B211D; font: 600 15px Figtree, sans-serif; color: #ECEEE8; cursor: pointer">T</button>
      </nav>
    </div>
  </header>

  <main style="max-width: 1160px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 20px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: clamp(34px, 5vw, 52px); line-height: 1.05; letter-spacing: -0.03em">Mitä tänään syötäisiin?</h1>
      <label style="position: relative; display: block; max-width: 640px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hae reseptejä</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3ACA5" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="Hae nimellä tai raaka-aineella, esim. lohi" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0 20px 0 52px; border-radius: 16px; border: 1px solid #3A433D; background: #1B211D; font: 400 17px Figtree, sans-serif; color: #ECEEE8; outline-color: #E0593B">
      </label>
      <div role="group" aria-label="Suodata tunnisteilla" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tags}}" as="tag" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{tag.pressed}}" onClick="{{tag.toggle}}" style="{{tag.style}}">{{tag.label}}</button>
        </sc-for>
        <sc-if value="{{hasFilter}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{clear}}" style="min-height: 40px; padding: 0 12px; border: 0; background: transparent; font: 600 14px Figtree, sans-serif; color: #F08A70; text-decoration: underline; cursor: pointer">Tyhjennä</button>
        </sc-if>
      </div>
    </div>

    <p style="margin: 0; font-size: 15px; color: #A3ACA5">{{countLabel}}</p>

    <sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 28px 24px">
        <sc-for list="{{shown}}" as="r" hint-placeholder-count="12">
          <a href="RecipeDark.dc.html" class="card" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #ECEEE8; background: #1B211D; border-radius: 18px; padding: 10px 10px 16px; border: 1px solid #262D28">
            <div style="{{r.photo}}">
              <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="rgba(236,238,232,.3)" stroke-width="2" aria-hidden="true"><circle cx="24" cy="24" r="15"></circle><circle cx="24" cy="24" r="9"></circle><path d="M5 10v10a3 3 0 0 0 3 3v15M43 10v28M43 10c-4 2-4 10 0 13"></path></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 6px">
              <h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: -0.01em">{{r.title}}</h2>
              <div style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #A3ACA5">
                <span style="display: inline-flex; align-items: center; gap: 5px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                  {{r.time}}
                </span>
                <span>{{r.tagLine}}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 64px 24px; text-align: center; border: 1px dashed #3A433D; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center">
        <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Ei osumia</p>
        <p style="margin: 0; color: #A3ACA5">Kokeile toista hakusanaa tai poista suodattimia.</p>
      </div>
    </sc-if>

    <nav aria-label="Sivutus" style="display: flex; justify-content: center; gap: 8px; padding-top: 8px">
      <button type="button" aria-label="Edellinen sivu" disabled style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #2A322D; background: transparent; color: #4A534D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </button>
      <button type="button" aria-current="page" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #ECEEE8; color: #121614; font: 600 15px Figtree, sans-serif">1</button>
      <button type="button" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A433D; background: #1B211D; color: #ECEEE8; font: 600 15px Figtree, sans-serif; cursor: pointer">2</button>
      <button type="button" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A433D; background: #1B211D; color: #ECEEE8; font: 600 15px Figtree, sans-serif; cursor: pointer">3</button>
      <button type="button" aria-label="Seuraava sivu" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A433D; background: #1B211D; color: #ECEEE8; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', picked: [], theme: 'dark' };
  }
  renderVals() {
    var self = this;
    var tones = ['#262C24', '#30271F', '#212B2A', '#2E2B1E', '#2B232A', '#232B20'];
    var recipes = [
      { title: 'Lohikeitto', time: '45 min', tags: ['keitto', 'kala', 'arki'] },
      { title: 'Karjalanpiirakat', time: '1 h 30 min', tags: ['leivonta', 'perinne'] },
      { title: 'Mustikkapiirakka', time: '1 h', tags: ['jälkiruoka', 'leivonta'] },
      { title: 'Pinaattiohukaiset', time: '30 min', tags: ['kasvis', 'arki'] },
      { title: 'Kaalikääryleet', time: '2 h 30 min', tags: ['perinne'] },
      { title: 'Korvapuustit', time: '2 h', tags: ['leivonta'] },
      { title: 'Hernekeitto', time: '3 h', tags: ['keitto', 'perinne'] },
      { title: 'Makaronilaatikko', time: '1 h', tags: ['arki'] },
      { title: 'Kantarellikastike', time: '25 min', tags: ['kasvis', 'arki'] },
      { title: 'Joulutortut', time: '1 h', tags: ['joulu', 'leivonta', 'jälkiruoka'] },
      { title: 'Rosolli', time: '40 min', tags: ['joulu', 'kasvis'] },
      { title: 'Uunilohi', time: '35 min', tags: ['kala', 'arki'] }
    ];
    var allTags = ['arki', 'kasvis', 'keitto', 'kala', 'leivonta', 'jälkiruoka', 'perinne', 'joulu'];
    var picked = this.state.picked;
    var q = (this.state.q || '').trim().toLowerCase();
    var shown = recipes.filter(function (r) {
      var okTags = picked.every(function (t) { return r.tags.indexOf(t) >= 0; });
      var okQ = !q || r.title.toLowerCase().indexOf(q) >= 0 || r.tags.join(' ').indexOf(q) >= 0;
      return okTags && okQ;
    }).map(function (r) {
      return {
        title: r.title, time: r.time, tagLine: r.tags.join(' · '),
        photo: 'aspect-ratio: 4 / 3; border-radius: 12px; display: grid; place-items: center; background: ' + tones[recipes.indexOf(r) % tones.length]
      };
    });
    var base = 'min-height: 40px; padding: 0 16px; border-radius: 999px; font: 500 15px Figtree, sans-serif; cursor: pointer; ';
    return {
      q: this.state.q,
      onSearch: function (e) { self.setState({ q: e.target.value }); },
      tags: allTags.map(function (t) {
        var on = picked.indexOf(t) >= 0;
        return {
          label: t, pressed: on ? 'true' : 'false',
          style: base + (on ? 'border: 1px solid #ECEEE8; background: #ECEEE8; color: #121614' : 'border: 1px solid #3A433D; background: #1B211D; color: #ECEEE8'),
          toggle: function () {
            self.setState({ picked: on ? picked.filter(function (x) { return x !== t; }) : picked.concat([t]) });
          }
        };
      }),
      hasFilter: picked.length > 0 || !!q,
      clear: function () { self.setState({ picked: [], q: '' }); },
      shown: shown,
      hasResults: shown.length > 0,
      noResults: shown.length === 0,
      countLabel: shown.length === 1 ? '1 resepti' : shown.length + ' reseptiä',
      isLight: this.state.theme === 'light', isDark: this.state.theme === 'dark', isSystem: this.state.theme === 'system',
      themeTitle: { light: 'Vaalea tila', dark: 'Tumma tila', system: 'Järjestelmän mukaan' }[this.state.theme],
      themeLabel: 'Teema: ' + { light: 'vaalea', dark: 'tumma', system: 'järjestelmän mukaan' }[this.state.theme] + '. Vaihda teemaa.',
      cycleTheme: function () { self.setState({ theme: { light: 'dark', dark: 'system', system: 'light' }[self.state.theme] }); }
    };
  }
}
</script>
</body>
</html>
