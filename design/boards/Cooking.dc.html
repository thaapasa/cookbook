<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Kokkausnäkymä – Lohikeitto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#131915}
a{color:#F1F2EC}a:hover{color:#FFFFFF}
.ck{appearance:none;-webkit-appearance:none;margin:0;width:30px;height:30px;border-radius:9px;border:2px solid #6E7A71;background:transparent;display:grid;place-items:center;flex:none;cursor:pointer}
.ck:checked{background:#E8674A;border-color:#E8674A}
.ck:checked::after{content:"";width:9px;height:15px;border:solid #131915;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.ck:focus-visible{outline:3px solid #F1F2EC;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #131915; color: #F1F2EC; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; line-height: 1.4; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 18px 32px; border-bottom: 1px solid #2A332D">
    <a href="Recipe.dc.html" aria-label="Sulje kokkausnäkymä" style="width: 52px; height: 52px; border-radius: 999px; background: #232B25; display: grid; place-items: center; color: #F1F2EC">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em">Lohikeitto</h1>
    <span style="font-size: 18px; color: #A7B0A9">4 annosta · 45 min</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #232B25; font-size: 15px; color: #C9D0CA">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      Näyttö pysyy päällä
    </span>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 0; min-height: 0">
    <section aria-labelledby="ing-h" style="flex: 1 1 340px; max-width: 420px; box-sizing: border-box; padding: 28px 32px; border-right: 1px solid #2A332D; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
        <h2 id="ing-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">Ainekset</h2>
        <span style="font-size: 16px; color: #A7B0A9">{{doneLabel}}</span>
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{ings}}" as="i" hint-placeholder-count="12">
          <li>
            <label style="display: flex; align-items: center; gap: 16px; min-height: 52px; cursor: pointer">
              <input type="checkbox" class="ck" checked="{{i.checked}}" onChange="{{i.toggle}}">
              <span style="display: flex; flex-direction: column; gap: 0">
                <span style="{{i.textStyle}}"><strong style="font-weight: 600">{{i.amount}}</strong> {{i.name}}</span>
                <sc-if value="{{i.showNote}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 16px; line-height: 1.35; color: #A7B0A9">{{i.note}}</span>
                </sc-if>
              </span>
            </label>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="steps-h" style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <h2 id="steps-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">Valmistus</h2>
        <span style="font-size: 16px; color: #A7B0A9">Napauta vaihetta korostaaksesi sen</span>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 6px">
          <h3 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A7B0A9">{{g.name}}</h3>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{g.steps}}" as="s" hint-placeholder-count="4">
              <li>
                <button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}}">
                  <span style="{{s.numStyle}}">{{s.n}}</span>
                  <span style="text-wrap: pretty">{{s.text}}</span>
                </button>
              </li>
            </sc-for>
          </ol>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 3, done: { 0: true, 2: true, 3: true, 4: true } };
  }
  renderVals() {
    var self = this;
    var ings = [
      ['600 g', 'lohifilettä', 'nahaton ja ruodoton säästää aikaa'], ['500–600 g', 'kiinteitä perunoita', 'esim. Siikli tai Annabelle'], ['1', 'sipuli'], ['1', 'porkkana'],
      ['1 rkl', 'voita'], ['1 l', 'vettä'], ['1', 'kalaliemikuutio', 'esim. Knorr'], ['6', 'maustepippuria'],
      ['1', 'laakerinlehti'], ['2 dl', 'kaurakermaa', 'ruoanvalmistukseen tarkoitettu'], ['1 ruukku', 'tilliä', 'tuore; pakastetilli käy myös'], ['', 'suolaa']
    ];
    var steps = [
      'Kuori ja kuutioi perunat ja porkkana. Hienonna sipuli.',
      'Kuullota sipulia voissa kattilassa muutama minuutti.',
      'Lisää vesi, liemikuutio, maustepippurit ja laakerinlehti. Kiehauta.',
      'Lisää perunat ja porkkana. Keitä kannen alla noin 15 minuuttia, kunnes perunat ovat kypsiä.',
      'Poista lohesta nahka ja ruodot ja leikkaa se isoiksi kuutioiksi.',
      'Lisää kaurakerma ja lohi. Hauduta miedolla lämmöllä 5–7 minuuttia — älä anna kiehua voimakkaasti.',
      'Tarkista suola ja sekoita joukkoon hienonnettu tilli juuri ennen tarjoilua.'
    ];
    var done = this.state.done;
    var count = 0;
    var ingItems = ings.map(function (x, idx) {
      var on = !!done[idx];
      if (on) count++;
      return {
        amount: x[0], name: x[1], checked: on, note: x[2] || '', showNote: !!x[2] && !on,
        textStyle: on ? 'font-size: 21px; color: #7E8981; text-decoration: line-through; text-decoration-thickness: 2px' : 'font-size: 21px; color: #F1F2EC',
        toggle: function () {
          var next = Object.assign({}, self.state.done);
          next[idx] = !on;
          self.setState({ done: next });
        }
      };
    });
    var active = this.state.active;
    var btnBase = 'width: 100%; display: grid; grid-template-columns: 48px 1fr; gap: 18px; align-items: start; text-align: left; cursor: pointer; border-radius: 18px; padding: 18px 22px; font-family: Figtree, sans-serif; line-height: 1.4; ';
    var stepItems = steps.map(makeStep);
    return {
      ings: ingItems,
      doneLabel: count + ' / ' + ings.length + ' valmiina',
      groups: [
        { name: 'Keittopohja', from: 0, to: 4 },
        { name: 'Kala ja viimeistely', from: 4, to: 7 }
      ].map(function (g) {
        return { name: g.name, steps: stepItems.slice(g.from, g.to) };
      })
    };
    function makeStep(t, idx) {
        var on = idx === active;
        return {
          n: idx + 1, text: t, pressed: on ? 'true' : 'false',
          style: btnBase + (on
            ? 'border: 0; background: #F1F2EC; color: #131915; font-size: 30px; font-weight: 500; box-shadow: 0 0 0 4px #E8674A'
            : 'border: 1px solid #2A332D; background: #1A211C; color: #DDE2DC; font-size: 24px; font-weight: 400'),
          numStyle: 'width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; font-family: \'Bricolage Grotesque\', sans-serif; font-weight: 700; font-size: 20px; ' +
            (on ? 'background: #C4472B; color: #FFFFFF' : 'background: #2A332D; color: #F1F2EC'),
          pick: function () { self.setState({ active: on ? -1 : idx }); }
        };
    }
  }
}
</script>
</body>
</html>
