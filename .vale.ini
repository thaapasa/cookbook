# Prose linter for the docs. Rules: the Google developer documentation style
# guide, plus project tweaks in the Project style.
# `mise run prose` shows every alert, `mise run lint-prose` is the gate.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip

# The docs to lint. Code isn't linted.
[{README.md,ARCHITECTURE.md,HOSTING.md,assets/README.md,specs/*.md}]
BasedOnStyles = Vale, Google, Project

# Replaced by copies in the Project style with project exceptions.
Google.Headings = NO
Google.Acronyms = NO
Google.WordListCase = NO

# Raised from suggestion so the gate checks them.
Google.Semicolons = warning
