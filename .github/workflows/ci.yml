name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: cookbook
          POSTGRES_PASSWORD: cookbook
          POSTGRES_DB: cookbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookbook -d cookbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cookbook:cookbook@localhost:5432/cookbook
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Check that the Dockerfile uses the Node.js version from mise.toml
        run: |
          MISE_NODE=$(mise current node)
          DOCKER_NODE=$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)
          if [ "$MISE_NODE" != "$DOCKER_NODE" ]; then
            echo "::error::Dockerfile has Node.js $DOCKER_NODE, mise.toml has $MISE_NODE"
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
