[tools]
# The Node.js version for development, CI and the Docker image. When you
# change it, change NODE_VERSION in the Dockerfile too. CI checks that the two
# match.
node = "24.22.2"
# For psql and pg_dump, which scripts/copy-prod-db.sh uses. pg_dump refuses to
# dump a server with a newer major version, so keep this at the major version
# of the production database.
postgres = "18"
# The process manager for local development. See dekit.yaml.
dekit = "0.10.3"

[hooks]
# Install the npm dependencies after the tools. CI installs the exact versions
# from package-lock.json.
postinstall = 'if [ -n "$CI" ]; then npm ci; else npm install; fi'

[tasks.start]
description = "Start the dev server and the client in dekit"
run = "dekit"
raw = true
