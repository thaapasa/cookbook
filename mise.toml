[tools]
# The Node.js version for development, CI and the Docker image. When you
# change it, change NODE_VERSION in the Dockerfile too. CI checks that the two
# match.
node = "24.22.2"
# For psql and pg_dump, which scripts/copy-prod-db.sh uses. pg_dump refuses to
# dump a server with a newer major version, so keep this at the major version
# of the production database.
postgres = "18"
# The process manager for local development. See dekit.yaml.
dekit = "0.10.3"
# The prose linter for the docs. See .vale.ini.
vale = "3.28.1"

[hooks]
# Install the npm dependencies after the tools. CI installs the exact versions
# from package-lock.json.
postinstall = 'if [ -n "$CI" ]; then npm ci; else npm install; fi'

[tasks.start]
description = "Start the dev server and the client in dekit"
run = "dekit"
raw = true

[tasks.clean]
description = "Remove the npm dependencies and the build output"
run = "rm -rf node_modules dist build coverage .vite *.tsbuildinfo"

# Prose: Vale with the Google developer documentation style, on the docs only
# (.vale.ini sets the scope). `prose` shows every alert, including
# suggestions. `lint-prose` is the gate and fails on warnings and errors.
[tasks.prose]
description = "Show all prose alerts in the docs; pass paths to narrow"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -d .vale/styles/Google ] || vale sync
if [ $# -eq 0 ]; then set -- README.md ARCHITECTURE.md HOSTING.md assets/README.md specs; fi
vale "$@"
'''

[tasks.lint-prose]
description = "Fail on prose warnings and errors in the docs"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -d .vale/styles/Google ] || vale sync
# Vale exits 1 on error-level alerts and above 1 when it can't run, such as
# with a broken .vale.ini or a missing style.
status=0
out=$(vale --minAlertLevel warning --output line README.md ARCHITECTURE.md HOSTING.md assets/README.md specs) || status=$?
if [ "$status" -gt 1 ]; then echo "$out"; exit "$status"; fi
if [ -n "$out" ]; then echo "$out"; exit 1; fi
'''
